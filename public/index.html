<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Xland AI Web"
    >

    <title>Xland AI</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>

<div id="app" class="app">


    <!-- ============================ -->
    <!-- SIDEBAR -->
    <!-- ============================ -->

    <aside
        id="sidebar"
        class="sidebar"
    >

        <div class="sidebar-header">

            <div class="brand">

                <div class="brand-icon">
                    X
                </div>

                <div>

                    <div class="brand-name">
                        Xland AI
                    </div>

                    <div class="brand-version">
                        Web 1.0
                    </div>

                </div>

            </div>

        </div>


        <button
            id="newChatButton"
            class="new-chat-button"
        >

            <span>＋</span>

            New Chat

        </button>


        <div class="history-title">

            Chat History

        </div>


        <div
            id="chatList"
            class="chat-list"
        ></div>


        <div class="sidebar-footer">

            <button
                id="themeButton"
                class="sidebar-action"
            >

                <span>🌙</span>

                <span>
                    Dark Mode
                </span>

            </button>


            <button
                id="settingsButton"
                class="sidebar-action"
            >

                <span>⚙️</span>

                <span>
                    Settings
                </span>

            </button>

        </div>

    </aside>


    <!-- ============================ -->
    <!-- MAIN -->
    <!-- ============================ -->

    <main class="main">


        <!-- TOPBAR -->

        <header class="topbar">

            <button
                id="mobileMenuButton"
                class="mobile-menu-button"
            >
                ☰
            </button>


            <div class="topbar-title">

                <strong>
                    Xland AI
                </strong>

                <span>
                    Gemini
                </span>

            </div>


            <div class="connection-status">

                <span
                    class="status-dot"
                ></span>

                Online

            </div>

        </header>


        <!-- ======================== -->
        <!-- MESSAGES -->
        <!-- ======================== -->

        <section
            id="messages"
            class="messages"
        >

            <div
                id="welcome"
                class="welcome"
            >

                <div class="welcome-icon">
                    X
                </div>

                <h1>
                    Welcome to Xland AI
                </h1>

                <p>
                    Your AI assistant on the web.
                </p>


                <div class="suggestions">

                    <button
                        class="suggestion"
                        data-prompt="Explain quantum computing simply."
                    >
                        Explain something
                    </button>

                    <button
                        class="suggestion"
                        data-prompt="Write a Python program for me."
                    >
                        Write code
                    </button>

                    <button
                        class="suggestion"
                        data-prompt="Give me some creative ideas for a game."
                    >
                        Brainstorm
                    </button>

                </div>

            </div>

        </section>


        <!-- ======================== -->
        <!-- COMPOSER -->
        <!-- ======================== -->

        <div class="composer-container">


            <div
                id="filePreview"
                class="file-preview"
            ></div>


            <div class="composer">


                <button
                    id="fileButton"
                    class="composer-button"
                    title="Upload file"
                >
                    📎
                </button>


                <input
                    id="fileInput"
                    type="file"
                    hidden
                >


                <textarea
                    id="messageInput"
                    placeholder="Message Xland AI..."
                    rows="1"
                ></textarea>


                <button
                    id="sendButton"
                    class="send-button"
                    title="Send"
                >
                    ➤
                </button>

            </div>


            <div class="composer-footer">

                Xland AI Web may have usage limits.

            </div>

        </div>


    </main>


    <!-- ============================ -->
    <!-- SETTINGS MODAL -->
    <!-- ============================ -->

    <div
        id="settingsModal"
        class="modal hidden"
    >

        <div class="modal-box">

            <div class="modal-header">

                <h2>
                    Settings
                </h2>

                <button
                    id="closeSettings"
                    class="close-button"
                >
                    ×
                </button>

            </div>


            <div class="setting-row">

                <div>

                    <strong>
                        Theme
                    </strong>

                    <p>
                        Change the appearance.
                    </p>

                </div>


                <button
                    id="modalThemeButton"
                    class="setting-button"
                >
                    Dark
                </button>

            </div>


            <div class="setting-row">

                <div>

                    <strong>
                        Language
                    </strong>

                    <p>
                        Interface language.
                    </p>

                </div>


                <select
                    id="languageSelect"
                    class="setting-select"
                >

                    <option value="en">
                        English
                    </option>

                    <option value="fa">
                        فارسی
                    </option>

                </select>

            </div>


            <div class="setting-row">

                <div>

                    <strong>
                        Model
                    </strong>

                    <p>
                        AI model used by Xland AI.
                    </p>

                </div>

                <span>
                    Gemini 2.5 Flash
                </span>

            </div>

        </div>

    </div>


    <!-- ============================ -->
    <!-- MOBILE OVERLAY -->
    <!-- ============================ -->

    <div
        id="overlay"
        class="overlay"
    ></div>


</div>


<script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
></script>


<script
    src="/js/app.js"
></script>


</body>

</html>
